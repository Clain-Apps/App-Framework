# Compatibility wrapper for callers that still use deploy-static.yml.
# Frozen tag deploy-static-v1 is not moved. New production callers should pin
# Clain-Apps/App-Framework/.github/workflows/deploy.yml@deploy-v1.
# Nested reusable workflows resolve a relative path against the caller, so this
# wrapper always calls the Framework repository by name.
name: Deploy static site

on:
  workflow_call:
    inputs:
      vps_host:
        description: SSH hostname for the deploy account
        required: true
        type: string
      vps_user:
        description: SSH account. Non-root unless allow_root is true.
        required: true
        type: string
      deploy_root:
        description: Absolute parent directory. Clain-Apps uses /apps.
        required: true
        type: string
      app_name:
        description: Directory name under deploy_root. Defaults to the repository name.
        required: false
        type: string
        default: ""
      allow_root:
        description: Permit an explicitly configured root SSH account
        required: false
        type: boolean
        default: false
      rollback:
        description: Repoint current at the previous release
        required: false
        type: boolean
        default: false
      node_version_file:
        description: Relative Node.js version file in the caller repository
        required: true
        type: string
      install_command:
        description: Single-line install command fixed in the caller workflow
        required: true
        type: string
      build_command:
        description: Single-line command that writes the release directory
        required: true
        type: string
      output_directory:
        description: Relative directory uploaded as the release
        required: true
        type: string
      entry_file:
        description: Relative entry file that must exist in the release directory
        required: true
        type: string
    secrets:
      VPS_SSH_KEY:
        required: true
      VPS_KNOWN_HOSTS:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    uses: Clain-Apps/App-Framework/.github/workflows/deploy.yml@main
    with:
      profile: static
      vps_host: ${{ inputs.vps_host }}
      vps_user: ${{ inputs.vps_user }}
      deploy_root: ${{ inputs.deploy_root }}
      app_name: ${{ inputs.app_name }}
      allow_root: ${{ inputs.allow_root }}
      rollback: ${{ inputs.rollback }}
      node_version_file: ${{ inputs.node_version_file }}
      install_command: ${{ inputs.install_command }}
      build_command: ${{ inputs.build_command }}
      output_directory: ${{ inputs.output_directory }}
      entry_file: ${{ inputs.entry_file }}
    secrets:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
